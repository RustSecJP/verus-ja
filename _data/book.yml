short: Verus
title: Verus ガイド
original_title: Verus Tutorial and Reference
seo_title: Verus ガイド（Rust コードの形式検証ツール「Verus」公式ドキュメント日本語訳）
summary: Rust で書かれたコードの正しさを静的に検証するツール「Verus」の公式ガイド（チュートリアルとリファレンス）の、非公式な日本語訳。仕様と証明の書き方、量化子とトリガー、証明の開発と性能、unsafe なコードや並行性の検証、仕様言語のリファレンスまで、全 160 章を全文訳している。
